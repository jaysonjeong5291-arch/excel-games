<style>

.shell{max-width:1140px;margin:10px auto 45px;border:1px solid #c6d9cb;background:#fff;box-shadow:0 3px 10px #0e492013;min-height:calc(100vh - 85px)}.title{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#e6f1e9;padding:11px 15px;border-bottom:1px solid #cfdfd3}.title strong{font-size:15px;color:#0e6337}.title small{font-size:10px;color:#607b66}.pill{display:inline-block;background:#fff;border:1px solid #c8dccc;border-radius:2px;color:#235d3b;padding:5px 8px;font-weight:700}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.button{background:#fff;color:#1b6a3b;border:1px solid #a7cdb4;border-radius:2px;padding:8px 12px;font-weight:700}.button.primary{color:#fff;background:var(--excel);border-color:#0f6c3b}.button.danger{border-color:#e5bdb6;color:#9b413c}.button:hover:not(:disabled){background:#eaf6ee}.button.primary:hover:not(:disabled){background:#096535}.button.selected{background:#e4f2e9;border-color:var(--excel)}.pane{padding:15px}.heading{background:#eef5f0;border-top:1px solid #ceded2;border-bottom:1px solid #ceded2;padding:9px 12px;font-weight:800;color:#2b6b45;margin-bottom:12px}.sheet{border-collapse:collapse;width:100%;font-size:12px}.sheet th,.sheet td{border:1px solid var(--line);padding:10px;text-align:left}.sheet th{background:#f2f6f3;color:#607969;font-weight:700}.sheet tr:nth-child(even) td{background:#fbfcfb}.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid var(--line);background:#fff;padding:14px;min-width:0}.card.self{border-top:3px solid #27854e}.card.turn{box-shadow:inset 0 0 0 2px #2f9c5e;background:#f3fff6}.card .who{font-weight:800;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.card small{color:var(--muted)}.dice{display:flex;gap:7px;margin:14px 0 8px;align-items:center;justify-content:center;flex-wrap:wrap}.die{background:#fff;border:2px solid #a4c6ae;border-radius:8px;width:66px;height:66px;display:grid;place-items:center;font-size:42px;line-height:1;color:#275f3e;box-shadow:0 2px 4px #0a371314}.die.unknown{background:#e7efe9;color:#8ca89a;font-size:30px}.die.option{padding:0;border:2px solid #bfd4c4;width:54px;height:54px;font-size:38px}.die.option:hover:not(:disabled){border-color:#129150;background:#effff2}.die.option:disabled{opacity:.4}.notice{margin:12px 0;padding:12px;background:#eef8f0;border-left:3px solid #0f8442;color:#205c38;line-height:1.6}.notice.error{background:#fff0ed;color:#9f3b32;border-left-color:#b84238}.stages{display:flex;background:#f8faf8;overflow-x:auto;border-bottom:1px solid #d8e6db}.stage{white-space:nowrap;padding:9px 10px;font-size:10px;color:#809387;border-right:1px solid #e6eee8}.stage.current{color:#0d7240;background:#dff1e5;font-weight:800}.bets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}.bets>div{padding:12px;border-right:1px solid var(--line);min-width:0}.bets small{display:block;color:#748a78;font-size:10px;margin-bottom:4px}.bets strong{font-size:16px;font-variant-numeric:tabular-nums}.controls{padding:14px;background:#f5faf6;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}.controls h3{margin:0;color:#1d7040;font-size:13px}.choice-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.input{width:130px;padding:10px 8px;border:1px solid #acc9b5;border-radius:2px;background:#fff;color:#24472d}.note{font-size:10px;color:#7d8b80;line-height:1.65}.result{font-size:14px;padding:18px;border:1px solid #c0dec7;background:#eef9f0;line-height:1.85}.share input{width:min(270px,65vw)}.action-log{padding:10px 15px;font-size:11px;color:#667e6b;border-top:1px solid #e3eee5;min-height:38px;line-height:1.5}.room-list{margin-top:12px}.room-list td:last-child{text-align:right}.game-hint{font-size:11px;line-height:1.75;margin:12px 0;color:#62796a}.footer-note{padding:12px 15px;background:#fcfdfc;border-top:1px solid #dfeae1;color:#748776;font-size:10px;line-height:1.7}.load{font-size:12px;color:#5b795f;padding:20px;text-align:center}

</style></head><body>
<div class="shell">
  <header class="title"><div><strong>▦ 업무현황 · 언더오버 1:1</strong><div><small>비공개 첫 주사위 / 두 차례 베팅 / 마지막 언더·오버 교환</small></div></div><div class="toolbar"><span class="pill" id="wallet">테스트 10,000P</span><button class="button" id="back">Sheet1</button></div></header>
  <div id="stage" class="stages"></div><div id="root" class="pane"><p class="load">서버와 연결 중…</p></div>
  <div id="feedback" class="action-log">포인트는 운영 서버와 분리된 언더오버 테스트 재화입니다.</div>
  <footer class="footer-note">TEST: 1회 시작 비용 10P씩(팟 생성), 나머지 베팅은 상한 없음 · 본인 잔액 및 상대 콜 가능 금액까지만 베팅 가능 · 실제 회원 포인트/홀덤 잔액은 변경되지 않음 · 회원 인증은 기존 계정 사용</footer>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const API='https://ghijkkumzvutfzpvdekv.supabase.co', KEY='sb_publishable_dWxi5S2-WH8Rn2sE0ADHJQ_JvbBjGBu';
const fmt=n=>Number(n||0).toLocaleString('ko-KR'),esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const faces=['','⚀','⚁','⚂','⚃','⚄','⚅'];
let room=new URLSearchParams(location.search).get('room')||'',data=null,lobby=[],busy=false,polling=false;
let chosenDie=0,errorMessage='',wallet=10000,timeout=0;
// Same-origin iframe can have partitioned storage on mobile browsers.
// Trust the exact parent frame and origin; never send credentials in the URL.
let parentClient='',parentToken='',parentAuthSeen=false;
const embedded=window.parent!==window;
const client=()=>{if(embedded)return parentClient;try{return sessionStorage.getItem('renju-multi-client-v1')||''}catch{return ''}};
const token=()=>{if(embedded)return parentToken;try{return localStorage.getItem('excel-games-member-session-v1')||''}catch{return ''}};
function isParentAuthMessage(e){return embedded&&e.source===window.parent&&e.origin===location.origin&&e.data?.type==='UO_AUTH'}
window.addEventListener('message',e=>{
 if(!isParentAuthMessage(e))return;
 parentAuthSeen=true;
 parentClient=typeof e.data.client==='string'?e.data.client:'';
 parentToken=typeof e.data.token==='string'?e.data.token:'';
});
function requestParentAuth(){if(embedded)window.parent.postMessage({type:'UO_AUTH_REQUEST'},location.origin)}
function ensureCredentials(){
 if(!embedded)return Promise.resolve(client().length>=5&&token().length>=12);
 if(parentAuthSeen)return Promise.resolve(client().length>=5&&token().length>=12);
 return new Promise(resolve=>{
  let timeoutId;
  function receive(e){if(!isParentAuthMessage(e))return;clearTimeout(timeoutId);window.removeEventListener('message',receive);resolve(client().length>=5&&token().length>=12)}
  window.addEventListener('message',receive);
  timeoutId=setTimeout(()=>{window.removeEventListener('message',receive);resolve(false)},4500);
  requestParentAuth();
 });
}

function feedback(t,bad=false){$('feedback').textContent=t||'';$('feedback').style.color=bad?'#a9433c':'#667e6b';}
async function rpc(action,choice=null,amount=null,roomOverride=null){
 const signal=AbortSignal.timeout(12000);
 const reply=await fetch(API+'/rest/v1/rpc/renju_uo_rpc',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_action:action,p_client:client(),p_token:token(),p_room:roomOverride===null?room:roomOverride,p_choice:choice,p_amount:amount}),signal,cache:'no-store'});
 const payload=await reply.json().catch(()=>null);if(!reply.ok||!payload?.ok)throw new Error(payload?.message||payload?.error||'서버 오류 '+reply.status+(reply.status===404?' · SQL 설치 여부 확인':''));return payload;
}
function isMineTurn(){return !!data?.my_seat&&data.actor===data.my_seat;}
function humanPhase(p){return {waiting:'참가·준비',choose1:'첫 주사위 비공개 선택',bet1:'1차 베팅',sides:'언더·오버 선택',bet2:'2차 베팅',swap:'선택 교환',finished:'최종 결과'}[p]||p}
function stageBar(){let order=['waiting','choose1','bet1','sides','bet2','swap','finished'];$('stage').innerHTML=order.map((s,i)=>`<span class="stage ${s===data?.phase?'current':''}">${i+1}. ${humanPhase(s)}</span>`).join('')}
function render(){stageBar();if(!data){$('wallet').textContent='테스트 포인트';renderLobby();return}$('wallet').textContent='테스트 '+fmt(data.my_balance)+'P';renderRoom();updateClock()}
function updateClock(){const el=$('uo-clock');if(!el)return;if(!data?.deadline){el.textContent='';return}const seconds=Math.max(0,Math.ceil((new Date(data.deadline).getTime()-Date.now())/1000));el.textContent=seconds+'초 남음';}
function back(){if(window.parent!==window)window.parent.postMessage({type:'UO_CLOSE'},location.origin);else{room='';data=null;history.replaceState(null,'',location.pathname);refresh();}}
$('back').addEventListener('click',back);
function renderLobby(){let html='<div class="heading">언더오버 1:1 · 온라인 방 목록</div><div class="flex"><button id="create" class="button primary">＋ 새 언더오버방</button><button id="reload" class="button">↻ 새로고침</button><button id="resetWallet" class="button">테스트 포인트 초기화</button></div><p class="game-hint">두 명이 비공개로 첫 주사위를 선택하고 공개한 뒤 1차 베팅, 언더/오버, 2차 베팅, 교환 결정을 진행합니다. 상대방의 주사위와 선택은 서버에서 관리됩니다.</p><div class="flex share"><input class="input" id="join-code" placeholder="방 코드 u-xxxxxxxxxxxx"/><button id="join" class="button">입장</button></div><div class="room-list"><table class="sheet"><thead><tr><th>방 번호</th><th>방장</th><th>참가자</th><th>진행</th><th></th></tr></thead><tbody>';
 html+=(lobby.length?lobby.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.p1)}</td><td>${esc(x.p2||'대기')}</td><td>${humanPhase(x.status)}</td><td><button data-join="${esc(x.id)}" class="button">입장</button></td></tr>`).join(''):'<tr><td colspan="5">아직 생성된 언더오버방이 없습니다.</td></tr>');html+='</tbody></table></div>';$('root').innerHTML=html;
 $('create').onclick=()=>act('create');$('reload').onclick=refresh;$('resetWallet').onclick=()=>{if(confirm('테스트용 포인트를 10,000P로 초기화할까요?'))act('reset_wallet')};
 $('join').onclick=()=>join($('join-code').value.trim());$('root').querySelectorAll('[data-join]').forEach(el=>el.onclick=()=>join(el.dataset.join));
}
function seatOf(n){return data?.players?.find(p=>p.seat===n)||{};}
function dieHtml(n,hide=false){return `<div class="die ${(!n||hide)?'unknown':''}">${(!n||hide)?'?':faces[n]}</div>`}
function renderRoom(){const d=data,me=d.my_seat,players=d.players||[];
 const allowReveal=d.phase!=='choose1'&&d.phase!=='waiting';
 let html=`<div class="flex" style="justify-content:space-between;margin-bottom:10px"><div><b>${esc(d.room)}</b> · 제${d.hand}판 · ${humanPhase(d.phase)} · <span id="uo-clock"></span></div><div class="flex"><button class="button" id="invite">🔗 초대 링크 복사</button><button class="button danger" id="leave">${d.phase==='waiting'||d.phase==='finished'?'방 나가기':'기권하고 나가기'}</button></div></div>`;
 html+=`<div class="bets"><div><small>목표 숫자</small><strong>${d.target??'–'}</strong></div><div><small>총 팟</small><strong>${fmt(d.pot)}P</strong></div><div><small>현재 베팅</small><strong>${fmt(d.current_bet)}P</strong></div><div><small>내 테스트 잔액</small><strong>${fmt(d.my_balance)}P</strong></div></div>`;
 html+='<div class="cards">';for(const p of players){let mine=me===p.seat;let selected=allowReveal?p.die1:0;
  html+=`<div class="card ${mine?'self':''} ${d.actor===p.seat?'turn':''}"><div class="who"><span>${p.seat===1?'1P':'2P'} · ${esc(p.name||'참가자 대기')}</span><small>${p.ready?'준비 ✓':''}</small></div><div class="dice">${dieHtml(selected)}${d.phase==='finished'&&d.die2?dieHtml(d.die2[p.seat-1]):dieHtml(null)}</div><div class="flex" style="justify-content:space-between"><span>${esc(p.side==='under'?'언더':p.side==='over'?'오버':'진영 미정')}</span><small>베팅 ${fmt(p.bet)}P</small></div><div class="note">잔액 ${fmt(p.balance)}P · 누적 베팅 ${fmt(p.committed)}P</div></div>`;
 }html+='</div>';
 const isTurn=isMineTurn(),p=seatOf(me),other=seatOf(me===1?2:1),gap=Math.max(0,Number(d.current_bet)-Number(p.bet||0));
 const max=Math.max(0,Math.min(Number(p.bet||0)+Number(p.balance||0),Number(other.bet||0)+Number(other.balance||0)));
 html+=`<div class="controls"><h3>${d.phase==='finished'?'라운드 종료':isTurn?'▶ 내 차례입니다.':humanPhase(d.phase)}</h3>`;
 if(d.phase==='waiting'){
   html+=`<div class="notice">두 명이 입장해 준비를 완료하면 방장이 게임을 시작합니다. 시작 시 각자 테스트 포인트 10P가 기본 팟으로 들어갑니다.</div><div class="flex">${me>0?`<button data-act="ready" class="button ${p.ready?'':'primary'}">${p.ready?'준비 취소':'준비 완료'}</button>`:''}${me===1?`<button data-act="start" class="button primary" ${!(players[0].ready&&players[1].ready&&players[1].name)?'disabled':''}>게임 시작</button>`:''}</div>`;
 } else if(d.phase==='choose1'){
   html+=`<div class="notice">1~6 중 하나를 고르세요. 서로의 선택은 두 명 모두 확정하기 전까지 공개되지 않습니다.</div>`;
   if(me>0&&!d.my_die_selected)html+=`<div class="choice-row">${[1,2,3,4,5,6].map(n=>`<button class="die option" data-die="${n}" aria-label="${n} 선택">${faces[n]}</button>`).join('')}</div>`;
   else html+=`<div class="notice">${d.my_die_selected?'선택 완료 · 상대방 선택 대기':'다른 플레이어가 선택 중입니다.'}</div>`;
 } else if(d.phase==='bet1'||d.phase==='bet2'){
   html+=`<div class="notice">${d.phase==='bet1'?'첫 주사위가 높은 사람이 먼저 레이즈 또는 체크할 수 있습니다. 후순위자는 콜·폴드만 가능합니다.':'언더/오버를 나중에 배정받은 사람이 먼저 베팅합니다. 레이즈·재레이즈·콜·체크·폴드·올인을 지원합니다.'}</div>`;
   if(isTurn&&me>0){let first=d.phase==='bet1',firstActor=me===d.first_bettor;html+='<div class="choice-row">';
    if(gap===0&&(!first||firstActor))html+='<button class="button" data-bet="check">체크</button>';
    if(gap>0)html+='<button class="button primary" data-bet="call">콜 '+fmt(Math.min(gap,p.balance))+'P</button>';
    html+='<button class="button danger" data-bet="fold">폴드</button>';
    if(!first||firstActor){if(max>d.current_bet)html+=`<label>레이즈 총액 <input class="input" type="number" min="${d.current_bet+1}" step="1" id="raiseAmount" value="${Math.min(max,Math.max(d.current_bet+d.min_raise,1))}"/></label><button class="button primary" data-bet="raise">레이즈</button><button class="button" data-bet="allin">올인</button>`;}
    html+=`</div><div class="note">현재 콜 금액 ${fmt(gap)}P · 가능한 최대 총베팅 ${fmt(max)}P · 상대가 콜할 수 없는 초과 금액은 베팅할 수 없습니다.</div>`;
   }else html+='<div class="note">상대방의 베팅 순서를 기다리고 있습니다.</div>';
 } else if(d.phase==='sides'){
   html+='<div class="notice">첫 주사위가 낮은 사람이 언더 또는 오버를 선택합니다. 같은 숫자라면 처음 베팅한 사람이 나중 순서이므로 2P가 먼저 선택합니다. 다른 사람은 반대 진영이 자동 배정됩니다.</div>';
   if(isTurn)html+='<div class="choice-row"><button class="button primary" data-side="under">언더 (목표보다 작음)</button><button class="button primary" data-side="over">오버 (목표보다 큼)</button></div>';
 } else if(d.phase==='swap'){
   html+='<div class="notice">2차 주사위는 이미 서버에서 비공개로 확정되었습니다. 언더/오버를 나중에 배정받은 사람이 최종 공개 전 두 사람의 진영을 서로 바꿀지 결정합니다.</div>';
   if(isTurn)html+='<div class="choice-row"><button class="button primary" data-switch="keep">선택 유지</button><button class="button" data-switch="swap">언더/오버 서로 교환</button></div>';
 } else if(d.phase==='finished'){
   let r=d.result||{},who=r.winner===0?'무승부 · 투자금 반환':r.winner===1?esc(seatOf(1).name)+' 승리':r.winner===2?esc(seatOf(2).name)+' 승리':'결과 확정';
   html+=`<div class="result"><b>${who}</b><div>결과: ${r.type==='fold'?'폴드 승리':r.type==='forfeit'?'기권 승리':r.type==='push'?'목표 숫자와 일치':r.type==='timeout_cancel'?'시간 초과 · 팟 반환':r.type==='timeout'?'시간 초과 · 상대 승리':'주사위 총합 '+fmt(r.total)+' · 목표 '+fmt(r.target)}</div>${r.type==='showdown'||r.type==='push'?`<div>1차 주사위: ${d.players[0].die1} + ${d.players[1].die1} · 2차 주사위: ${d.die2?.join(' + ')}</div><div>최종 진영: 1P ${d.players[0].side==='under'?'언더':'오버'} / 2P ${d.players[1].side==='under'?'언더':'오버'} · ${r.swapped?'진영 교환':'진영 유지'}</div>`:''}<div>총 팟 ${fmt(r.pot)}P</div></div><div class="note">재대결하려면 두 플레이어가 다시 준비하고 방장이 시작을 눌러 주세요.</div><div class="flex">${me?`<button data-act="ready" class="button">${p.ready?'준비 취소':'재대결 준비'}</button>`:''}${me===1?`<button data-act="start" class="button primary" ${!(players[0].ready&&players[1].ready)?'disabled':''}>재대결 시작</button>`:''}<button class="button" data-act="reset_wallet">테스트 포인트 초기화</button></div>`;
 }
 html+='</div>';
 if(!me)html+='<div class="note">정원 초과로 관전 중입니다. 현재 점수와 공개 정보만 확인할 수 있어요.</div>';
 $('root').innerHTML=html;
 $('invite').onclick=()=>{const url=new URL(location.href);url.searchParams.set('room',d.room);const parentUrl=new URL(location.origin+location.pathname.replace(/underover\.html$/,'index.html'));parentUrl.searchParams.set('room',d.room);navigator.clipboard?.writeText(parentUrl.href).then(()=>feedback('초대 링크 복사 완료')).catch(()=>feedback('링크: '+parentUrl.href));};
 $('leave').onclick=()=>{if(confirm('현재 게임 진행 중이라면 기권 처리되고 팟을 상대에게 넘깁니다. 나가시겠습니까?'))act('leave');};
 $('root').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
 $('root').querySelectorAll('[data-die]').forEach(b=>b.onclick=()=>act('die',b.dataset.die));
 $('root').querySelectorAll('[data-bet]').forEach(b=>b.onclick=()=>{let c=b.dataset.bet;let n=c==='raise'?Number($('raiseAmount')?.value):null;
  if(c==='raise'&&(!Number.isSafeInteger(n)||n<1))return feedback('레이즈 총액을 정수로 입력해 주세요.',true);act('bet',c,n);});
 $('root').querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>act('side',b.dataset.side));
 $('root').querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>act('switch',b.dataset.switch));
}
function urlRoom(id){room=id;const u=new URL(location.href);u.searchParams.set('room',id);history.replaceState(null,'',u.pathname+u.search);}
async function join(id){if(!/^u-[0-9a-f]{12}$/.test(id))return feedback('올바른 언더오버 방 코드를 입력해 주세요.',true);urlRoom(id);await act('join')}
async function act(action,choice=null,amount=null){if(busy)return;busy=true;
 try{if(!(await ensureCredentials())){feedback('회원 정보를 불러오지 못했습니다. Sheet1에서 로그인 상태를 확인한 뒤 다시 열어 주세요.',true);return;}const next=await rpc(action,choice,amount);if(action==='create'){urlRoom(next.created_room);}if(action==='reset_wallet'){wallet=next.my_balance;if(data){data.my_balance=next.my_balance;const mine=data.players?.find(p=>p.seat===data.my_seat);if(mine)mine.balance=next.my_balance;}feedback('테스트 포인트 10,000P 초기화 완료');render();return;}if(action==='leave'){room='';data=null;history.replaceState(null,'',location.pathname);feedback('방에서 나왔습니다.');await refresh();return;}
 data=next;wallet=next.my_balance??wallet;chosenDie=0;feedback('서버 처리 완료 · '+humanPhase(next.phase));render();}
 catch(e){feedback('요청 실패: '+e.message,true);if(action==='join'){room='';data=null;history.replaceState(null,'',location.pathname);render();}}
 finally{busy=false;}
}
async function refresh(){if(busy||polling)return;polling=true;try{
 if(room){if(!(await ensureCredentials())){feedback('회원 로그인 정보가 없습니다. Sheet1에서 로그인한 후 다시 열어 주세요.',true);return;}let d=await rpc('sync');if(!data||Number(d.revision)>Number(data.revision)){data=d;wallet=d.my_balance??wallet;render();}else updateClock();}
 else{const response=await rpc('list');lobby=response.rooms||[];render();}}
 catch(e){feedback('동기화 실패: '+e.message,true);if(!room)renderLobby();}finally{polling=false;}}
if(room&&!/^u-[0-9a-f]{12}$/.test(room))room='';
if(!room){renderLobby();refresh()}else{act('join')}setInterval(()=>{if(!document.hidden)refresh()},1500);setInterval(updateClock,400);window.addEventListener('focus',refresh);
</script></body></html>
