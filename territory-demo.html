<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>

<title>영토전 | 플레이 가능한 테스트</title>
<style>
:root{color-scheme:dark;--bg:#101922;--panel:#1a2831;--panel2:#22323c;--line:#3c535a;--text:#f0eddf;--muted:#aebcbb;--accent:#e3b86f;--green:#84b79c;--red:#ec968a;--blue:#89afd9}
*{box-sizing:border-box}body{margin:0;font-family:'Pretendard','Malgun Gothic','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-width:315px}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.37;cursor:not-allowed}
.game{height:100dvh;min-height:600px;display:flex;flex-direction:column;overflow:hidden}
.top{min-height:63px;background:#192630;border-bottom:2px solid #45534f;display:flex;align-items:center;gap:14px;padding:9px 18px;z-index:4}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}.brand .seal{width:42px;height:42px;background:#b88a51;display:grid;place-items:center;border:2px solid #edc482;border-radius:9px;color:#18201c;font-size:22px;box-shadow:inset 0 0 0 2px #473829}.brand-title{font-family:Georgia,serif;font-size:23px;font-weight:900;letter-spacing:1px;color:#f3d195}.subtitle{font-size:11px;color:#9fafac;margin-top:2px}
.top-stats{display:flex;margin-left:auto;gap:9px;align-items:center;flex-wrap:wrap;justify-content:end}.statpill{border:1px solid #455a61;padding:6px 10px;border-radius:7px;background:#22333b;color:#dce3d9;font-size:12px;white-space:nowrap}.statpill strong{color:#ffdfa2;font-weight:800}
.btn{border:1px solid #62716c;background:#31434a;color:#e8eadf;padding:9px 11px;border-radius:7px;font-weight:800;font-size:12px;transition:background .12s;white-space:nowrap}.btn:hover:not(:disabled){background:#425863}.btn.gold{background:#9d6c35;border-color:#d7ab64;color:#fff5db}.btn.gold:hover:not(:disabled){background:#ba8648}.btn.red{background:#7a3c38;border-color:#bd7369}.btn.ghost{background:transparent;border-color:#647275}.btn.active{background:#527260;border-color:#96bd98}
.sheetline{height:29px;background:#e2e6e1;border-bottom:1px solid #9ea9a8;display:flex;gap:0;align-items:end;padding-left:16px;color:#59605e;font:12px Arial,sans-serif;flex-shrink:0}
.sheetline span{padding:6px 20px 5px;border-right:1px solid #b1b9b5}.sheetline .current{color:#176947;background:#fff;border-top:2px solid #258b5d;font-weight:700}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;background:#131e27}
.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:#6a9270}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;image-rendering:pixelated}#world.drag{cursor:grabbing}
.map-label{position:absolute;left:15px;top:14px;pointer-events:none;display:flex;flex-direction:column;gap:6px}.map-label .title{background:#17251edb;color:#f3dfb4;border:1px solid #a79663;padding:7px 11px;border-radius:3px;font-family:serif;font-weight:900;font-size:16px;letter-spacing:2px;box-shadow:2px 3px 0 #0003}.map-label small{background:#17251ed8;font-size:11px;color:#d0d9c6;padding:6px 8px;max-width:340px}
.map-controls{position:absolute;bottom:16px;left:15px;display:flex;gap:6px}.map-legend{position:absolute;right:12px;bottom:13px;background:#192b29e8;padding:8px 10px;border-radius:6px;border:1px solid #b8c3a17a;display:flex;gap:11px;font-size:11px;box-shadow:0 4px 12px #0006;flex-wrap:wrap}.dot{display:inline-block;width:9px;height:9px;margin-right:4px;border:1px solid #ffffff66;border-radius:2px}
.sidebar{min-height:0;display:flex;flex-direction:column;background:var(--panel);border-left:2px solid #41524c;box-shadow:-7px 0 20px #14212a55;z-index:2}
.side-header{padding:17px 17px 10px;background:#24343b;border-bottom:1px solid #405257}.eyebrow{font-size:11px;color:#e2bb7f;font-weight:800;letter-spacing:1px}.territory-name{font-size:23px;font-weight:900;margin:6px 0 4px}.ownership{font-size:12px;color:#bfcfc5}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px}.metric{background:#17272c;border:1px solid #435359;border-radius:5px;padding:8px 5px;text-align:center}.metric small{display:block;color:#a6b9b2;font-size:10px}.metric strong{display:block;color:#f1d5a6;font-size:16px;margin-top:3px}
.tabs{display:flex;gap:0;background:#20323b;padding:0 7px;border-bottom:1px solid #456167}.tabs button{flex:1;min-width:0;border:0;border-bottom:3px solid transparent;padding:12px 3px 9px;color:#aabbba;background:none;font-size:12px;font-weight:800}.tabs button.selected{border-color:#cda56c;color:#fff4d7;background:#2d3f46}
.sidecontent{overflow:auto;flex:1;padding:14px 16px 24px}.section-title{font-size:13px;font-weight:900;color:#f7dcb0;margin:3px 0 12px}.text-muted{color:var(--muted);font-size:12px;line-height:1.55}.box{background:#24343d;border:1px solid #40565d;border-radius:8px;padding:12px;margin-bottom:12px}.line{display:flex;align-items:center;justify-content:space-between;gap:7px;margin:6px 0;font-size:12px}.line strong{color:#f1d9aa}.line em{color:#b3ccc2;font-style:normal}.divider{border-top:1px solid #3e5157;margin:13px 0}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row>.btn{flex:1}.caption{font-size:11px;color:#a6b7b4;line-height:1.6}.field{width:100%;background:#101d24;border:1px solid #567075;border-radius:6px;color:#eae9dc;padding:9px 8px;outline:none;font-size:12px}.field:focus{border-color:#d6b477}.field-label{font-size:12px;font-weight:800;color:#dddac9;display:block;margin:10px 0 6px}
.unit{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:9px 0;border-bottom:1px solid #35494f}.unit-name{font-size:12px;min-width:60px}.unit-name small{display:block;color:#a4b7ab;font-size:10px;margin-top:3px}.control{display:flex;gap:5px;align-items:center}.control .btn{padding:5px 7px;min-width:29px}.unit-count{font-size:13px;font-weight:900;min-width:39px;text-align:center;color:#f0d7ad}
.selector{display:flex;gap:5px;margin:10px 0;flex-wrap:wrap}.selector button{flex:1;background:#1c2c35;color:#c5d0c9;border:1px solid #4a5d60;border-radius:6px;padding:8px 5px;font-size:11px;font-weight:800}.selector button.chosen{background:#526647;color:#fff4db;border-color:#adbf7d}.progress{height:6px;background:#101c22;border-radius:7px;overflow:hidden;margin:8px 0}.progress>div{height:100%;background:#deb46f;transition:width .3s}
.log-item{border-left:3px solid #c5ab73;margin:10px 0;background:#25373d;padding:9px 10px;font-size:12px;line-height:1.5}.log-item small{color:#a1b3b1;display:block;margin-top:4px}
.callout{background:#2c392e;border:1px solid #5c785b;padding:10px 11px;border-radius:6px;font-size:11px;line-height:1.6;color:#d8e3d0;margin-bottom:10px}
.bottom{background:#17242c;border-top:1px solid #40565b;padding:9px 15px;display:flex;gap:10px;justify-content:space-between;align-items:center;min-height:44px;font-size:11px;color:#adc2bb}.bottom span b{color:#f6d39a}
.toast{position:fixed;left:50%;bottom:65px;transform:translateX(-50%);z-index:20;background:#f4dfad;color:#2c312d;padding:10px 18px;border-radius:8px;box-shadow:0 5px 35px #0008;font-weight:800;font-size:12px;max-width:min(92vw,600px);text-align:center;opacity:0;pointer-events:none;transition:opacity .18s}.toast.show{opacity:1}
@media(max-width:950px){.main{grid-template-columns:minmax(0,1fr) 290px}.sidebar{font-size:12px}.top{gap:8px;padding:8px}.brand-title{font-size:19px}.statpill{padding:5px 6px}.top-stats{gap:4px}}
@media(max-width:700px){.game{height:auto;min-height:100dvh;overflow:visible}.top{min-height:58px;flex-wrap:wrap}.top-stats{width:100%;justify-content:space-between}.statpill{flex:1;text-align:center}.top .btn{font-size:11px;padding:7px 9px}.sheetline{height:26px}.main{display:flex;flex-direction:column;min-height:0}.mapwrap{height:46vh;min-height:300px;flex-shrink:0}.map-label{left:8px;top:8px}.map-label .title{font-size:12px;padding:5px}.map-label small{font-size:9px;max-width:210px}.sidebar{min-height:460px;max-height:none;border-left:0;border-top:2px solid #475850}.sidecontent{overflow:visible}.map-legend{right:7px;bottom:8px;gap:5px;font-size:9px}.map-controls{bottom:9px;left:8px}.bottom{flex-wrap:wrap}}

<body>
<div class="game">
<header class="top">
  <div class="brand"><div class="seal">⚔</div><div><div class="brand-title">영토전</div><div class="subtitle">한국 지역 영토전 · TEST v0.3</div></div></div>
  <div class="top-stats"><div class="statpill">세력 <strong id="topFaction">PLAYER군</strong></div><div class="statpill">포인트 <strong id="topPoints">15,000 P</strong></div><div class="statpill">군량 <strong id="topGrain">6,000</strong></div><button class="btn" id="recruitBtn">＋ 병력 모집</button><button class="btn ghost" id="resetBtn" title="모든 테스트 데이터 초기화">↺ 초기화</button><button class="btn ghost" id="exitBtn">↩ Sheet1</button></div>
</header>
<div class="sheetline" aria-hidden="true"><span>영토전</span></div>
<div class="main">
  <section class="mapwrap" id="mapFrame" aria-label="영토전 영토 지도"><canvas id="world" aria-label="클릭 가능한 24개 영토 지도"></canvas>
    <div class="map-label"><div class="title">전국 영토 지도</div><small>성 또는 땅을 클릭하면 정보가 나와요. 드래그로 이동 · 휠로 확대</small></div>
    <div class="map-controls"><button class="btn" id="zoomIn" aria-label="확대">＋</button><button class="btn" id="zoomOut" aria-label="축소">－</button><button class="btn" id="centerMap">⌖ 전체</button></div>
    <div class="map-legend"><span><i class="dot" style="background:#5099cb"></i>내 영토</span><span><i class="dot" style="background:#d16d62"></i>적국</span><span><i class="dot" style="background:#d2c9a8"></i>중립</span></div>
  </section>
  <aside class="sidebar"><div class="sheet-column-headers" aria-hidden="true"><span class="sheet-col-corner"></span><span>A</span><span>B</span></div><div class="side-header" id="summary"></div><div class="tabs" id="tabs"><button data-tab="overview" class="selected">영토 정보</button><button data-tab="garrison">병력 배치</button><button data-tab="defense">자동 방어</button><button data-tab="logs">전투 기록</button></div><div class="sidecontent" id="panel"></div></aside>
</div>
<div class="bottom"><span><b>테스트 모드</b> · 브라우저에만 저장 · 실제 공용 포인트 차감 없음</span><span id="bottomStatus">영토를 클릭해 선택하세요.</span></div>
</div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const KEY='territory_prototype_v03', LEGACY_KEY='cheonha_prototype_v01'; const COLS=6,ROWS=4,PER=8,TILE=32,W=COLS*PER*TILE,H=ROWS*PER*TILE;
const NAMES=['파주','고양','서울','의정부','춘천','강릉','인천','부천','수원','용인','원주','동해','평택','천안','대전','청주','충주','안동','군산','전주','광주','대구','울산','부산'];
const OWNERS={player:{name:'내 세력',color:'#5c9ed0',fill:'rgba(63,151,214,.17)'},wei:{name:'서부 연합',color:'#d57668',fill:'rgba(222,102,88,.16)'},shu:{name:'북부 연합',color:'#72ad7c',fill:'rgba(99,170,113,.17)'},wu:{name:'남부 연합',color:'#b49cdd',fill:'rgba(168,143,224,.15)'},neutral:{name:'중립',color:'#d2bc91',fill:'rgba(223,189,136,.035)'}};
const GENERALS=['김유신','강감찬','권율','이순신','계백','을지문덕'];

let t=selected(),owner=t.owner==='player'?(state.name==='PLAYER'?'내 세력':state.name+' 세력'):colorTint(t).name;$('#summary').innerHTML=`
<div class="sheet-data-row sheet-banner"><span class="sheet-rownum">1</span><span class="sheet-banner-cell">${t.owner==='player'?'나의 영토':t.owner==='neutral'?'중립 영토':'상대 영토'} · ${String(t.id+1).padStart(2,'0')}</span></div>
<div class="sheet-data-row"><span class="sheet-rownum">2</span><span class="sheet-key">지역명</span><strong class="sheet-value sheet-place">${t.name} <span style="color:${colorTint(t).color}">⚑</span></strong></div>
<div class="sheet-data-row"><span class="sheet-rownum">3</span><span class="sheet-key">소유 세력</span><strong class="sheet-value">${owner}</strong></div>
<div class="sheet-data-row"><span class="sheet-rownum">4</span><span class="sheet-key">지형 / 성벽</span><span class="sheet-value">${t.terrain} / Lv.${t.level}</span></div>
<div class="sheet-data-row"><span class="sheet-rownum">5</span><span class="sheet-key">주둔 병력</span><strong class="sheet-value">${fmt(troopCount(t.troops))}명</strong></div>
<div class="sheet-data-row"><span class="sheet-rownum">6</span><span class="sheet-key">담당 장수</span><strong class="sheet-value">${t.general||'미배치'}</strong></div>
<div class="sheet-data-row"><span class="sheet-rownum">7</span><span class="sheet-key">보호 상태</span><span class="sheet-value" id="protCountdown">${t.protectUntil>now()?Math.ceil((t.protectUntil-now())/1000)+'초':'없음'}</span></div>`;
$('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.dataset.tab===state.tab))}
function line(key,val){return `<div class="line"><span>${key}</span><strong>${val}</strong></div>`}
function renderOverview(t){let isMine=t.owner==='player',avail=sourcesFor(t.id),valid=avail.length>0;let html=`<div class="section-title">${isMine?'영지 상황':'정찰 보고'}</div><div class="box">${line('영토명',t.name)}${line('지형',t.terrain)}${line('성벽',`Lv.${t.level}`)}${line('주둔 장수',t.general||'없음')}${line('보병 / 궁병 / 기병',`${fmt(t.troops.inf)} / ${fmt(t.troops.arch)} / ${fmt(t.troops.cav)}`)}${line('수비 전술',TACTICS[t.defense]?.name||'균형 수비')}${line('보호시간',t.protectUntil>now()?Math.ceil((t.protectUntil-now())/1000)+'초 남음':'없음')}</div>`;
if(isMine){html+=`<div class="callout">병력은 각 영토에 실제로 배치됩니다. 출정한 병력은 해당 영토의 자동 방어에 참여하지 않습니다.</div><div class="row"><button class="btn gold" data-action="tab" data-val="garrison">병력 배치</button><button class="btn" data-action="tab" data-val="defense">자동 방어</button></div><div class="divider"></div><button class="btn" style="width:100%" data-action="raid" ${state.raid?'disabled':''}>⚔ AI 모의 침공 (자동 방어 시험)</button><p class="caption">12초 뒤 서버 전투 공식과 같은 규칙으로 방어 판정. 테스트이므로 실제 병력·소유권은 감소하지 않아요.</p>`}
else{html+=`<div class="callout">${valid?'인접한 내 영토에서 출정할 수 있습니다.':'현재 인접한 내 영토가 없습니다. 주변 영토를 먼저 확보하세요.'}</div><button class="btn gold" style="width:100%" data-action="tab" data-val="attack" ${!valid||!!state.pending?'disabled':''}>⚔ 공격 명령</button>`}
if(state.pending){let p=state.pending;html+=`<div class="divider"></div><div class="section-title">진행 중인 출정</div><div class="box">${line('공격 목표',state.lands[p.target].name)}${line('출전 병력',fmt(troopCount(p.troops))+'명')}${line('전투까지',`<span id="eta">${Math.max(0,Math.ceil((p.dueAt-now())/1000))}초</span>`)}<div class="progress"><div id="attackProgress" style="width:${Math.min(100,(now()-p.createdAt)/(p.dueAt-p.createdAt)*100)}%"></div></div></div>`}
return html}
function renderGarrison(t){if(t.owner!=='player')return '<div class="callout">내 영토를 선택해야 병력을 배치할 수 있어요.</div>';let h=`<div class="section-title">주둔군 편성</div><div class="box">${line('선택 영토',t.name)}${line('현재 주둔',fmt(troopCount(t.troops))+'명')}${line('예비군 보유',fmt(troopCount(state.reserve))+'명')}</div><div class="field-label">방어 장수 (영토당 1명)</div><select class="field" id="generalSelect">${[t.general,...state.generalPool].filter((s,i,arr)=>arr.indexOf(s)===i).map(g=>`<option value="${g}">${g}</option>`).join('')}</select><p class="caption">장수는 다른 영토와 중복 배치할 수 없어요.</p><div class="divider"></div><div class="section-title">병력 배치 / 회수</div>`;
for(let [key,name,icon] of UNIT_META)h+=`<div class="unit"><div class="unit-name">${icon} ${name}<small>예비 ${fmt(state.reserve[key])}명</small></div><div class="control"><button class="btn" data-action="troop" data-key="${key}" data-amount="-50" ${t.troops[key]<50?'disabled':''}>−50</button><div class="unit-count">${fmt(t.troops[key])}</div><button class="btn" data-action="troop" data-key="${key}" data-amount="50" ${state.reserve[key]<50?'disabled':''}>+50</button></div></div>`;
h+=`<p class="caption" style="margin-top:11px">※ 테스트 버전은 예비군 배치를 즉시 처리합니다. 정식 멀티플레이에서는 영토 간 이동시간을 적용할 예정입니다.</p>`;return h}
function renderDefense(t){if(t.owner!=='player')return '<div class="callout">내 영토를 선택해야 자동 방어 전술을 변경할 수 있어요.</div>';let html=`<div class="section-title">자동 방어 정책</div><div class="callout">게임을 종료해도 이 영토의 주둔군과 장수, 수비 전술을 저장합니다. 공격이 들어오면 이 설정으로 자동 판정합니다.</div>`;for(const [key,v] of Object.entries(TACTICS)){html+=`<button class="btn ${t.defense===key?'active':''}" style="width:100%;text-align:left;white-space:normal;margin:3px 0;padding:12px" data-action="defense" data-val="${key}"><b>${t.defense===key?'◉':'○'} ${v.name}</b><div class="caption" style="margin-top:5px">${v.desc}</div></button>`}
html+=`<div class="divider"></div><div class="box">${line('수비 장수',t.general||'미배치')}${line('병력',fmt(troopCount(t.troops))+'명')}${line('지형 방어',`+${Math.round(terrainBonus(t)*100)}%`)}${line('성벽 방어',`+${t.level*9}%`)}${line('전술 보정',`${TACTICS[t.defense].value>=1?'+':''}${Math.round((TACTICS[t.defense].value-1)*100)}%`)}</div><button class="btn" data-action="raid" ${state.raid?'disabled':''} style="width:100%">🛡 이 설정으로 방어 모의시험</button>`;return html}
function renderLogs(){let h=`<div class="section-title">최근 전투 · 사건 기록</div><p class="caption">저장된 로그 ${state.logs.length}개. 외부 이용자에게 공유되지 않는 테스트 기록이에요.</p>`;for(const l of state.logs){let date=new Date(l.time);h+=`<div class="log-item" style="border-left-color:${l.type==='lose'?'#ce786a':l.type==='win'?'#85bba0':'#c5ab73'}">${l.text}<small>${date.toLocaleDateString('ko-KR')} ${date.toLocaleTimeString('ko-KR')}</small></div>`}return h}
function renderAttack(t){if(t.owner==='player')return '<div class="callout">적 또는 중립 영토를 선택하세요.</div>';let avail=sourcesFor(t.id);if(!avail.length)return '<div class="callout">공격할 수 있는 인접 아군 영토가 없습니다.</div>';if(!avail.some(a=>a.id===state.attackSource))state.attackSource=avail[0].id;let source=state.lands[state.attackSource];let percent=Number(state.attackPercent)||75;let troop={};for(let [key] of UNIT_META)troop[key]=Math.floor(source.troops[key]*percent/100);let cost=Math.max(30,Math.round(troopCount(troop)*.25));let left=Math.max(0,Math.ceil((state.attackReadyAt-now())/1000));let prot=Math.max(0,Math.ceil((t.protectUntil-now())/1000));let unavailable=!!state.pending||left>0||prot>0||state.grain<cost||troopCount(troop)<30;
let h=`<div class="section-title">⚔ ${t.name} 공격 명령</div><div class="box">${line('방어측',OWNERS[t.owner].name)}${line('적 주둔 병력',fmt(troopCount(t.troops))+'명')}${line('성벽 / 지형',`Lv.${t.level} / ${t.terrain}`)}</div><label class="field-label" for="sourceSelect">출정 거점</label><select class="field" id="sourceSelect">${avail.map(s=>`<option value="${s.id}" ${s.id===source.id?'selected':''}>${s.name} · ${fmt(troopCount(s.troops))}명</option>`).join('')}</select><label class="field-label" for="percentInput">출전 병력: 주둔군의 ${percent}% (${fmt(troopCount(troop))}명)</label><input id="percentInput" style="width:100%;accent-color:#c59a59" type="range" min="25" max="100" step="25" value="${percent}"/>`;
for(const [key,name] of UNIT_META)h+=line(name,fmt(troop[key])+'명');h+=`<label class="field-label" for="tacticSelect">공격 전술</label><select class="field" id="tacticSelect">${Object.entries(ATTACK_TACTICS).map(([key,val])=>`<option value="${key}" ${key===state.attackTactic?'selected':''}>${val.name}</option>`).join('')}</select><div class="divider"></div><div class="box">${line('진군 (테스트)', '12초')}${line('필요 군량',`${fmt(cost)} / ${fmt(state.grain)}`)}${line('출정 쿨타임',left?`${left}초 남음`:'준비 완료')}${line('상대 보호시간',prot?`${prot}초 남음`:'없음')}</div><button class="btn gold" style="width:100%" data-action="attack" ${unavailable?'disabled':''}>⚔ 출정 명령 확정</button><p class="caption">출정 즉시 내 거점의 주둔 병력이 감소합니다. 12초 뒤 전투를 정산하며, 새로고침 후에도 진행 상태가 유지됩니다.</p>`;return h}
function renderRecruit(){let cost=UNIT_META.find(x=>x[0]===state.recruitType)?.[3]||300;let qty=Number(state.recruitQty)||100,allCost=qty/100*cost;let h=`<div class="section-title">병력 모집소</div><div class="callout">병력은 기존 공용 포인트가 아닌 <b>테스트용 15,000P</b>로 모집합니다. 모든 모집 병력은 본성 예비군으로 들어갑니다.</div><label class="field-label">모집 병종</label><div class="selector">`;for(const [key,name,icon] of UNIT_META)h+=`<button class="${state.recruitType===key?'chosen':''}" data-action="recruit-type" data-val="${key}">${icon} ${name}</button>`;h+=`</div><label class="field-label">모집 인원</label><div class="selector">`;for(const count of [100,200,500])h+=`<button class="${qty===count?'chosen':''}" data-action="recruit-qty" data-val="${count}">${count}명</button>`;h+=`</div><div class="box">${line('보유 포인트',fmt(state.points)+'P')}${line('예상 비용',fmt(allCost)+'P')}${line('모집 후 잔액',fmt(state.points-allCost)+'P')}</div><button class="btn gold" style="width:100%" data-action="recruit" ${state.points<allCost?'disabled':''}>병력 모집 확정</button><div class="divider"></div><button class="btn" style="width:100%" data-action="tab" data-val="garrison">영토 배치로 돌아가기</button>`;return h}
function render(){updateHeader();let t=selected(),panel=$('#panel');panel.innerHTML=state.tab==='overview'?renderOverview(t):state.tab==='garrison'?renderGarrison(t):state.tab==='defense'?renderDefense(t):state.tab==='logs'?renderLogs():state.tab==='attack'?renderAttack(t):renderRecruit();draw()}
$('#tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;render();save()});
$('#panel').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let action=b.dataset.action,t=selected();
if(action==='tab'){state.tab=b.dataset.val;render();save();return}
if(action==='troop'){if(t.owner!=='player'||(state.pending?.source===t.id)||(state.raid?.target===t.id)){toast('전투가 진행 중인 영토는 병력을 수정할 수 없어요.');return}let k=b.dataset.key,d=Number(b.dataset.amount);if(!['inf','arch','cav'].includes(k))return;if(d>0&&state.reserve[k]<d)return;if(d<0&&t.troops[k]<-d)return;t.troops[k]+=d;state.reserve[k]-=d;render();save();return}
if(action==='defense'){if(t.owner!=='player'||state.raid?.target===t.id)return;if(TACTICS[b.dataset.val]){t.defense=b.dataset.val;toast(`${t.name}: ${TACTICS[t.defense].name} 설정 완료`);render();save()}return}
if(action==='raid'){if(t.owner!=='player'||state.raid)return;let size=Math.max(100,Math.round(troopCount(t.troops)*1.13));state.raid={target:t.id,troops:{inf:Math.round(size*.53),arch:Math.round(size*.29),cav:Math.round(size*.18)},createdAt:now(),dueAt:now()+12000};log(`🛡 ${t.name} 모의 침공 시작! 12초 뒤 자동 방어 결과가 나옵니다.`);toast('AI 모의 침공 시작! 실제 병력 손실 없음');render();save();return}
if(action==='recruit-type'){state.recruitType=b.dataset.val;render();save();return}
if(action==='recruit-qty'){state.recruitQty=Number(b.dataset.val);render();save();return}
if(action==='recruit'){let item=UNIT_META.find(x=>x[0]===state.recruitType),qty=state.recruitQty,cost=item[3]*qty/100;if(state.points<cost)return;state.points-=cost;state.reserve[item[0]]+=qty;log(`${item[1]} ${qty}명 모집 · ${fmt(cost)}P 차감`);toast(`${item[1]} ${qty}명 모집 완료`);render();save();return}
if(action==='attack'){attack();return}
});
$('#panel').addEventListener('change',e=>{let el=e.target,t=selected();if(el.id==='generalSelect'){if(t.owner!=='player')return;let old=t.general,name=el.value;if(name===old)return;if(!state.generalPool.includes(name))return;state.generalPool=state.generalPool.filter(x=>x!==name);state.generalPool.push(old);t.general=name;toast(`${t.name} 수비 장수: ${name}`);render();save()}
if(el.id==='sourceSelect'){state.attackSource=Number(el.value);render();save()}if(el.id==='percentInput'){state.attackPercent=Number(el.value);render();save()}if(el.id==='tacticSelect'){state.attackTactic=el.value;render();save()}});
function attack(){let t=selected(),src=state.lands[state.attackSource];if(t.owner==='player'||!src||src.owner!=='player'||!adjacent(t.id,src.id)){toast('인접 아군 영토에서만 출정할 수 있어요.');return}if(state.pending){toast('이미 출정 중인 군단이 있어요.');return}if(now()<state.attackReadyAt||now()<t.protectUntil){toast('출정 쿨타임 또는 영토 보호시간이 남았어요.');return}let pct=Number(state.attackPercent)||75;let troops={};for(const [k] of UNIT_META)troops[k]=Math.floor(src.troops[k]*pct/100);let count=troopCount(troops),cost=Math.max(30,Math.round(count*.25));if(count<30){toast('병력이 부족합니다.');return}if(state.grain<cost){toast('군량이 부족합니다.');return}if(state.raid?.target===src.id){toast('모의 침공 중에는 출정할 수 없습니다.');return}if(!confirm(`${src.name}에서 ${t.name}(으)로 ${fmt(count)}명 출정할까요?\n군량 ${fmt(cost)} 소모 · 테스트 진군 12초`))return;for(const [k] of UNIT_META)src.troops[k]-=troops[k];state.grain-=cost;state.pending={source:src.id,target:t.id,troops,tactic:state.attackTactic,createdAt:now(),dueAt:now()+12000};state.attackReadyAt=now()+20000;log(`⚔ ${src.name} → ${t.name}: ${fmt(count)}명 출정, 군량 ${fmt(cost)} 소비`);toast(`${t.name} 공격군 출정! 12초 후 전투 결과`);state.tab='overview';render();save()}
$('#recruitBtn').onclick=()=>{state.tab='recruit';render();save()};
$('#resetBtn').onclick=()=>{if(!confirm('모든 테스트 진행 데이터가 초기화됩니다.\n실제 공용 포인트에는 영향을 주지 않습니다. 초기화할까요?'))return;state=baseState();save();initialized=false;fit();render();toast('테스트 데이터를 초기화했어요.')};
$('#exitBtn').onclick=()=>{if(window.parent!==window){window.parent.postMessage({type:'CHEONHA_CLOSE'},'*')}else if(window.history.length>1){window.history.back()}else{toast('이 창은 닫거나 Sheet1로 돌아가면 됩니다.')}};
// One timer updates elapsed UI; offline elapsed actions are settled on the next visit.
setInterval(()=>{let resolved=updatePending();if(resolved){render();return}let p=state.pending,r=state.raid;if(p){let el=$('#eta'),bar=$('#attackProgress');if(el)el.textContent=Math.max(0,Math.ceil((p.dueAt-now())/1000))+'초';if(bar)bar.style.width=Math.min(100,(now()-p.createdAt)/(p.dueAt-p.createdAt)*100)+'%'}if((p||r||state.attackReadyAt>now()||selected().protectUntil>now())&&Math.floor(now()/1000)%2===0&&state.tab==='attack')render();let protect=$('#protCountdown');if(protect)protect.textContent=selected().protectUntil>now()?Math.ceil((selected().protectUntil-now())/1000)+'초':'없음';draw()},1000);
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(updatePending())render();else{render();save()}}});updatePending();resize();render();save();
})();
</script>
</body></html>
