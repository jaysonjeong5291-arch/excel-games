function buildPositions(){

 for(let d=0;d<DISTRICTS.length;d++){
  const name=DISTRICTS[d],ring=districtPolys[name]?.[0];if(!ring)continue;
  const box={minX:Math.min(...ring.map(q=>q[0])),maxX:Math.max(...ring.map(q=>q[0])),minY:Math.min(...ring.map(q=>q[1])),maxY:Math.max(...ring.map(q=>q[1]))};

  for(let y=box.minY+6;y<=box.maxY-6;y+=8)for(let x=box.minX+6;x<=box.maxX-6;x+=8){
   if(inDistrict(x,y,name)&&!isRiverArea(x,y,76))candidates.push([x,y]);
  }
  // Tiny districts near the river can use land close to the shore, but never the water.
  if(candidates.length<4)for(let y=box.minY+4;y<=box.maxY-4;y+=6)for(let x=box.minX+4;x<=box.maxX-4;x+=6){
   if(inDistrict(x,y,name)&&!isRiverArea(x,y,58))candidates.push([x,y]);
  }
  const center=CENTERS[name],chosen=[];
  for(const p of districtPlaces(d)){
   let best=null,bestScore=-1e30;
   for(const c of candidates){
    const dc=Math.hypot(c[0]-center[0],c[1]-center[1]);
    const sep=chosen.length?Math.min(...chosen.map(v=>Math.hypot(c[0]-v[0],c[1]-v[1]))):75;
    const edge=Math.min(c[0]-box.minX,box.maxX-c[0],c[1]-box.minY,box.maxY-c[1]);
    const score=(chosen.length?Math.min(sep,90)*1.8:0)-dc*.19+Math.min(15,edge)*.22+Math.min(40,Math.abs(c[1]-riverY(c[0]))-58)*.03;
    if(score>bestScore){bestScore=score;best=c;}
   }

   if(!best){const safeX=center[0];const safeY=riverY(safeX)+(center[1]<riverY(safeX)?-80:80);best=[safeX,safeY]}
   chosen.push(best);positions[p.id]=best;
  }
 }
}

function fitAll(){const w=frame.clientWidth,h=frame.clientHeight;if(!w||!h)return;zoom=Math.min(w/W,h/H)*1.015;panX=(w-W*zoom)/2;panY=(h-H*zoom)/2;initialized=true;draw()}
function fit(){
 const w=frame.clientWidth,h=frame.clientHeight;if(!w||!h)return;
 if(w<700){
  // A 25-district atlas is unreadable if shrunk to phone width: start near Mapo.
  zoom=Math.max(.52,Math.min(.90,h/H*.86));
  const [cx,cy]=districtCenter('마포구');panX=w*.50-cx*zoom;panY=h*.52-cy*zoom;
  initialized=true;draw();return;
 }

}

function mapToScreen(x,y){return [panX+x*zoom,panY+y*zoom]}
function overlapRects(a,b,margin=4){return a.x<b.x+b.w+margin&&a.x+a.w+margin>b.x&&a.y<b.y+b.h+margin&&a.y+a.h+margin>b.y}

 const sel=placeDefs[state.selectedPlace],selectedDistrict=state.selectedDistrict;
 for(let i=0;i<DISTRICTS.length;i++){

  let [wx,wy]=marks.length?[marks.reduce((v,q)=>v+q[0],0)/marks.length,marks.reduce((v,q)=>v+q[1],0)/marks.length]:districtCenter(districtName);

   const prog=districtProgress(i),isSelected=i===selectedDistrict;

  }
 }
 for(const p of placeDefs){

 }

for(const [key,v] of Object.entries(TACTICS))h+=`<button class="btn ${p.defense===key?'active':''}" style="width:100%;white-space:normal;text-align:left;margin:3px 0;padding:11px" data-action="defense" data-val="${key}"><strong>${p.defense===key?'◉':'○'} ${v.name}</strong><div class="caption">${v.desc}</div></button>`;
h+=`<div class="box" style="margin-top:12px">${line('주둔 조직원',fmt(troopCount(p.troops))+'명')}${line('수비 기본 전투력',fmt(unitPower(p.troops,true)))}${line('거점 방어 보정',Math.round(p.level*7.5)+'%')}${line('전술 보정',Math.round((TACTICS[p.defense].value-1)*100)+'%')}</div><button class="btn gold" style="width:100%" data-action="raid" ${state.raid?'disabled':''}>🛡 PC 모의 습격 시작</button>`;return h}
function recruitment(){let m=UNIT_META.find(x=>x[0]===state.recruitType)||UNIT_META[0],q=state.recruitQty||100,cost=q*m[3]/100;let h=`<div class="section-title">조직원 모집</div><div class="callout">공용 포인트가 아닌 테스트 전용 포인트로 모집합니다. 실제 보유 포인트는 변하지 않아요.</div><div class="field-label">조직원 유형</div><div class="selector">`;
for(const [key,name,icon] of UNIT_META)h+=`<button class="${state.recruitType===key?'chosen':''}" data-action="recruit-type" data-val="${key}">${icon} ${name}</button>`;
h+=`</div><div class="field-label">모집 규모</div><div class="selector">`;for(const q of [25,100,200])h+=`<button class="${state.recruitQty===q?'chosen':''}" data-action="recruit-qty" data-val="${q}">${q}명</button>`;
h+=`</div><div class="box">${line('보유 테스트 포인트',fmt(state.points)+' P')}${line('모집 비용',fmt(cost)+' P')}${line('잔여 포인트',fmt(state.points-cost)+' P')}</div><button class="btn gold" style="width:100%" data-action="recruit" ${state.points<cost?'disabled':''}>모집 확정</button><div class="divider"></div><button class="btn" style="width:100%" data-action="tab" data-val="garrison">거점 관리로 돌아가기</button>`;return h}
function attackPanel(p){if(p.owner==='player')return '<div class="callout">다른 조직의 랜드마크 또는 중립 랜드마크를 선택하세요.</div>';
const avail=sourcesFor(p);if(!avail.length)return '<div class="callout">인접한 내 거점이 없습니다. 지도에서 가까운 중립 거점부터 확보하세요.</div>';
if(!avail.some(q=>q.id===state.attackSource))state.attackSource=avail[0].id;const src=getPlace(state.attackSource),percent=state.attackPercent||75,troops=numTroops();for(const k of UNIT_KEYS)troops[k]=Math.floor(src.troops[k]*percent/100);
const crossing=crossRiver(src,p),cost=Math.max(25,Math.round(troopCount(troops)*.19*(crossing?1.3:1))),cool=Math.ceil(Math.max(0,state.attackReadyAt-now())/1000),protect=Math.ceil(Math.max(0,p.protectUntil-now())/1000),disabled=state.pending||cool||protect||cost>state.grain||troopCount(troops)<20;
let h=`<div class="section-title">${p.name} · 공격 명령</div><div class="box">${line('소속 구',p.district)}${line('경비 인원',fmt(troopCount(p.troops))+'명')}${line('방어 수준',`Lv.${p.level}`)}</div><label class="field-label">출발 거점</label><select class="field" id="sourceSelect">${avail.map(q=>`<option value="${q.id}" ${q.id===src.id?'selected':''}>${q.name} · ${fmt(troopCount(state.landmarks[q.id].troops))}명</option>`).join('')}</select>
<label class="field-label">출동 규모 ${percent}% (${fmt(troopCount(troops))}명)</label><input id="percentInput" type="range" min="25" max="100" step="25" value="${percent}" style="width:100%;accent-color:#107c41"/>`;
for(const [key,name] of UNIT_META)h+=line(name,fmt(troops[key])+'명');
h+=`<label class="field-label">진입 방식</label><select class="field" id="tacticSelect">${Object.entries(ATTACK_TACTICS).map(([k,v])=>`<option value="${k}" ${k===state.attackTactic?'selected':''}>${v.name}</option>`).join('')}</select>
<div class="box" style="margin-top:10px">${line('진군 (테스트)','12초')}${line('강 건너 진입',crossing?'한강 도하 · 보급 +30% / 공격력 -8%':'해당 없음')}${line('보급품 소비',fmt(cost)+' / '+fmt(state.grain))}${line('쿨타임',cool?cool+'초':'준비 완료')}${line('거점 보호',protect?protect+'초':'없음')}</div><button class="btn gold" style="width:100%" data-action="attack" ${disabled?'disabled':''}>⚔ 공격 확정</button><p class="caption">전투에 승리하면 해당 랜드마크만 점령하며, 구 안의 모든 거점을 확보하면 구 점령이 확정됩니다.</p>`;return h}
function logs(){let h=`<div class="section-title">전투 및 점령 기록</div><p class="caption">테스트 브라우저 내부 기록입니다.</p>`;for(const l of state.logs)h+=`<div class="log-item">${l.text}<small>${new Date(l.time).toLocaleString('ko-KR')}</small></div>`;return h}
function render(){if(state.selectedPlace==null||!placeDefs[state.selectedPlace])state.selectedPlace=placeDefs[0].id;updateHeader();const t=place();$('#panel').innerHTML=state.tab==='overview'?overview(t):state.tab==='garrison'?garrison(t):state.tab==='defense'?defense(t):state.tab==='logs'?logs():state.tab==='attack'?attackPanel(t):recruitment();draw()}
$('#tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){state.tab=b.dataset.tab;render();save()}});
$('#panel').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let action=b.dataset.action,p=place(),real=state.landmarks[p.id];
if(action==='select-place'){pickPlace(Number(b.dataset.val));return}
if(action==='tab'){state.tab=b.dataset.val;render();save();return}
if(action==='troop'){if(p.owner!=='player'||state.pending?.source===p.id||state.raid?.target===p.id){toast('출동 또는 수비 중인 거점에서는 인원을 변경할 수 없습니다.');return}let key=b.dataset.key,delta=Number(b.dataset.amount);if(!UNIT_KEYS.includes(key))return;if(delta>0&&state.reserve[key]<delta||delta<0&&real.troops[key]<-delta)return;real.troops[key]+=delta;state.reserve[key]-=delta;render();save();return}
if(action==='defense'){if(p.owner!=='player'||state.raid?.target===p.id)return;if(TACTICS[b.dataset.val]){real.defense=b.dataset.val;toast('자동 방어 설정을 변경했어요.');render();save()}return}
if(action==='raid'){if(p.owner!=='player'||state.raid)return;let n=Math.max(80,Math.round(troopCount(p.troops)*1.13));state.raid={target:p.id,troops:{inf:Math.round(n*.37),arch:Math.round(n*.12),cav:Math.round(n*.16),blade:Math.round(n*.10),tank:Math.round(n*.25)},dueAt:now()+12000,createdAt:now()};toast('모의 습격 시작! 12초 뒤 결과가 나옵니다.');log(`${p.name} 모의 습격 시작 · 실제 피해 없음`);render();save();return}
if(action==='recruit-type'){if(UNIT_KEYS.includes(b.dataset.val))state.recruitType=b.dataset.val;render();save();return}
if(action==='recruit-qty'){state.recruitQty=Number(b.dataset.val);render();save();return}
if(action==='recruit'){let m=UNIT_META.find(x=>x[0]===state.recruitType),qty=state.recruitQty,cost=m[3]*qty/100;if(!m||state.points<cost)return;state.points-=cost;state.reserve[m[0]]+=qty;log(`${m[1]} ${qty}명 영입 · ${fmt(cost)}P 차감`);toast(`${m[1]} ${qty}명 모집 완료`);render();save();return}
if(action==='attack'){attack();return}
});
$('#panel').addEventListener('change',e=>{const el=e.target;if(el.id==='sourceSelect')state.attackSource=Number(el.value);if(el.id==='percentInput')state.attackPercent=Number(el.value);if(el.id==='tacticSelect')state.attackTactic=el.value;render();save()});
function attack(){const t=place();if(t.owner==='player')return;const srcId=state.attackSource,src=placeDefs[srcId];if(!src||!isMine(srcId)||!nearby(src,t)){toast('출발할 수 있는 인접 거점이 없습니다.');return}if(state.pending){toast('이미 출동 중입니다.');return}if(now()<state.attackReadyAt||now()<t.protectUntil){toast('출동 대기시간 또는 목표 보호시간이 남았어요.');return}
const pct=Number(state.attackPercent)||75,troops=numTroops();for(const k of UNIT_KEYS)troops[k]=Math.floor((state.landmarks[srcId].troops[k]||0)*pct/100);const count=troopCount(troops),cost=Math.max(25,Math.round(count*.19*(crossRiver(src,t)?1.3:1)));if(count<20||state.grain<cost){toast('인원이나 보급품이 부족합니다.');return}
if(!confirm(`${src.name}에서 ${t.name} 거점으로 ${fmt(count)}명을 출동시키겠습니까?\n보급품 ${fmt(cost)} 소비 / 12초 이동`))return;
for(const k of UNIT_KEYS)state.landmarks[srcId].troops[k]-=troops[k];state.grain-=cost;state.pending={source:srcId,target:t.id,troops,tactic:state.attackTactic,createdAt:now(),dueAt:now()+12000};state.attackReadyAt=now()+16000;log(`${src.name} → ${t.name}: ${fmt(count)}명 출동 · 보급품 ${fmt(cost)} 사용`);state.tab='overview';toast(`${t.name} 공격 개시`);render();save()}
$('#recruitBtn').onclick=()=>{state.tab='recruit';render();save()};
$('#resetBtn').onclick=()=>{if(!confirm('이번 브라우저의 영토전 테스트 진행상황을 초기화할까요?\n실제 포인트는 바뀌지 않습니다.'))return;state=baseState();save();initialized=false;fit();render();toast('테스트 진행상황 초기화 완료')};
$('#exitBtn').onclick=()=>{if(window.parent!==window)window.parent.postMessage({type:'CHEONHA_CLOSE'},'*');else toast('Sheet1로 돌아가려면 영토전 탭을 닫아주세요.')};
setInterval(()=>{if(updatePending()){render();return}if(state.pending||state.raid||state.attackReadyAt>now()){if(state.tab==='attack'&&Math.floor(now()/1000)%2===0){render();return}const eta=$('#eta');if(eta&&state.pending)eta.textContent=Math.max(0,Math.ceil((state.pending.dueAt-now())/1000))+'초'}const prot=$('#protCountdown');if(prot){const p=place();prot.textContent=p.protectUntil>now()?Math.ceil((p.protectUntil-now())/1000)+'초':'없음'}},1000);
window.addEventListener('resize',resize);window.addEventListener('visibilitychange',()=>{if(!document.hidden){updatePending();render()}});
updatePending();resize();render();save();
})();

</script>
</body></html>
