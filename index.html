<style>

<main>
<div class="logo">X</div>
<p class="tag" style="margin-top:18px">EXCEL GAMES</p>
<h1>서비스 점검 중입니다</h1>
<p>게임 기능 안정화와 테스트를 위해<br>일반 사용자 접속을 일시 중단했습니다.<br>점검 완료 후 다시 이용하실 수 있습니다.</p>
<hr>
<small>이용에 불편을 드려 죄송합니다.</small>
</main>
